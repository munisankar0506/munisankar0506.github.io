<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="60" />
  <title>Worker issues · L2 leadership board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1118;
      --bg-elev: #141b25;
      --line: rgba(232, 236, 243, 0.08);
      --text: #eef2f7;
      --muted: #93a0b5;
      --now: #f3b14e;
      --next: #7eb6ff;
      --ok: #5fd4a8;
      --wait: #c9b27a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Instrument Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap { width: min(1100px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 56px; }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin: 0; }
    h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }

    a.back { color: var(--next); text-decoration: none; font-size: 13px; }
    a.back:hover { text-decoration: underline; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .stat .n { font-size: 32px; font-weight: 650; letter-spacing: -0.04em; }
    .stat .l { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .stat.worked .n { color: var(--next); }
    .stat.resolved .n { color: var(--ok); }
    .stat.open .n { color: var(--now); }

    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .place-block { margin-bottom: 12px; }
    .place-block h3 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pill.ecliptos { color: var(--next); }
    .pill.inception { color: var(--ok); }

    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 20px 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.in_progress { color: var(--now); }
    .pill.waiting_confirmation, .pill.waiting, .pill.answered { color: var(--wait); }
    .pill.resolved { color: var(--ok); }

    .issue {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .issue:last-child { border-bottom: 0; }
    .issue a { color: inherit; text-decoration: none; }
    .issue a:hover { color: var(--next); }
    .issue .title { font-weight: 550; line-height: 1.35; }
    .issue .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty { color: var(--muted); padding: 8px 0 16px; font-size: 14px; }

    @media (max-width: 960px) {
      header, .stats, .grid { display: block; }
      .stat, .card { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="kicker"><a class="back" href="index.html">← Leadership board</a></div>
        <h1 id="title">Worker</h1>
        <div class="kicker" id="role"></div>
      </div>
      <div class="kicker" id="source">Loading…</div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="grid">
      <section class="card">
        <h2>Worked</h2>
        <div id="worked"></div>
      </section>
      <section class="card">
        <h2>Resolved</h2>
        <div id="resolved"></div>
      </section>
      <section class="card">
        <h2>Open state</h2>
        <div id="open"></div>
      </section>
    </div>
  </div>

  <script>
    const STATUS = {
      in_progress: "In progress",
      waiting_confirmation: "Waiting for confirmation",
      waiting: "Waiting for confirmation",
      answered: "Waiting for confirmation",
      resolved: "Resolved"
    };

    function isWaiting(status) {
      return status === "waiting_confirmation" || status === "waiting";
    }

    function isOpen(status) {
      return status === "in_progress" || isWaiting(status);
    }

    function pill(text, cls) {
      return `<span class="pill ${cls || ""}">${text}</span>`;
    }

    function issueCard(issue) {
      const place = issue.place === "ecliptos" ? "EcliptOS" : "Inception";
      return `<article class="issue">
        <a class="title" href="${issue.url}" target="_blank" rel="noreferrer">${issue.title}</a>
        <div class="meta">
          ${pill(STATUS[issue.status] || issue.status, issue.status)}
          <span>${place}</span>
          <span>${issue.reporter}</span>
          <span>${issue.updated}</span>
        </div>
      </article>`;
    }

    function list(issues) {
      if (!issues.length) return `<div class="empty">None on this snapshot</div>`;
      const groups = [
        ["ecliptos", "EcliptOS"],
        ["inception", "Inception"]
      ];
      return groups.map(([id, label]) => {
        const mine = issues.filter((i) => i.place === id)
          .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
        if (!mine.length) return "";
        return `<div class="place-block"><h3>${label} · ${mine.length}</h3>${mine.map(issueCard).join("")}</div>`;
      }).join("") || `<div class="empty">None on this snapshot</div>`;
    }

    function render(board) {
      const id = new URLSearchParams(location.search).get("id");
      const worker = (board.workers || []).find((w) => w.id === id);
      if (!worker) {
        document.getElementById("title").textContent = "Worker not found";
        document.getElementById("source").textContent = "Unknown worker id";
        return;
      }

      const mine = (board.issues || []).filter((i) => i.assignee === worker.name);
      const resolved = mine.filter((i) => i.status === "resolved");
      const open = mine.filter((i) => isOpen(i.status));

      document.title = `${worker.name} · issues`;
      document.getElementById("title").textContent = worker.name;
      document.getElementById("role").textContent = worker.role;
      document.getElementById("source").textContent = board.source;

      document.getElementById("stats").innerHTML = `
        <div class="stat worked"><div class="n">${mine.length}</div><div class="l">Issues worked</div></div>
        <div class="stat resolved"><div class="n">${resolved.length}</div><div class="l">Resolved</div></div>
        <div class="stat open"><div class="n">${open.length}</div><div class="l">Open state</div></div>
      `;
      document.getElementById("worked").innerHTML = list(mine);
      document.getElementById("resolved").innerHTML = list(resolved);
      document.getElementById("open").innerHTML = list(open);
    }

    fetch(`data/board.json?t=${Date.now()}`, { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById("source").textContent = "Could not load data/board.json";
      });
  </script>
</body>
</html>
