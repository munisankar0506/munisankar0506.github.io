<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="60" />
  <title>Issue list · EcliptOS &amp; Inception</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1118;
      --bg-elev: #141b25;
      --line: rgba(232, 236, 243, 0.08);
      --text: #eef2f7;
      --muted: #93a0b5;
      --now: #f3b14e;
      --next: #7eb6ff;
      --ok: #5fd4a8;
      --wait: #c9b27a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Instrument Sans", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { width: min(1280px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 56px; }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 8px; }
    h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }
    a.back { color: var(--next); text-decoration: none; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 20px; }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .tab.active { border-color: var(--next); color: var(--next); }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .links a { color: var(--next); text-decoration: none; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    td a { color: inherit; text-decoration: none; }
    td a:hover { color: var(--next); }
    .pill {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .pill.in_progress { color: var(--now); }
    .pill.waiting_confirmation { color: var(--wait); }
    .pill.resolved { color: var(--ok); }
    .pill.ecliptos { color: var(--next); }
    .pill.inception { color: var(--ok); }
    .note { color: var(--muted); font-size: 13px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="kicker"><a class="back" href="index.html">← Leadership board</a></div>
        <h1>SharePoint placeholder · issue list</h1>
        <div class="note" id="source">Loading…</div>
      </div>
      <div class="links" id="links"></div>
    </header>

    <section class="card">
      <div class="tabs" id="tabs"></div>
      <table>
        <thead>
          <tr>
            <th>Place</th>
            <th>Issue</th>
            <th>Status</th>
            <th>Assigned worker</th>
            <th>Reporter</th>
            <th>Updated</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>

  <script>
    const STATUS = {
      in_progress: "In progress",
      waiting_confirmation: "Waiting for confirmation",
      waiting: "Waiting for confirmation",
      answered: "Waiting for confirmation",
      resolved: "Resolved"
    };

    let allIssues = [];
    let filter = "all";

    function placeName(place) {
      return place === "ecliptos" ? "EcliptOS" : "Inception";
    }

    function rows() {
      const shown = allIssues.filter((i) => filter === "all" || i.place === filter);
      document.getElementById("rows").innerHTML = shown.map((issue) => `
        <tr>
          <td><span class="pill ${issue.place}">${placeName(issue.place)}</span></td>
          <td><a href="${issue.url}" target="_blank" rel="noreferrer">${issue.title}</a></td>
          <td><span class="pill ${issue.status}">${STATUS[issue.status] || issue.status}</span></td>
          <td>${issue.assignee}</td>
          <td>${issue.reporter}</td>
          <td>${issue.updated}</td>
        </tr>
      `).join("");
    }

    function render(board) {
      const issues = [...(board.issues || [])].sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
      allIssues = issues;
      const ecliptos = issues.filter((i) => i.place === "ecliptos").length;
      const inception = issues.filter((i) => i.place === "inception").length;
      const sp = board.sharePoint || {};
      document.getElementById("source").textContent =
        `${board.source} · updates every 1 hour`;
      document.getElementById("links").innerHTML = `
        <a href="${sp.url || "#"}" target="_blank" rel="noreferrer">SharePoint link (placeholder)</a>
        <a href="${sp.csv || "data/sharepoint-list.csv"}">Download CSV</a>
      `;
      document.getElementById("tabs").innerHTML = `
        <button type="button" class="tab ${filter === "all" ? "active" : ""}" data-place="all">All · ${issues.length}</button>
        <button type="button" class="tab ${filter === "ecliptos" ? "active" : ""}" data-place="ecliptos">EcliptOS · ${ecliptos}</button>
        <button type="button" class="tab ${filter === "inception" ? "active" : ""}" data-place="inception">Inception · ${inception}</button>
      `;
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          filter = btn.getAttribute("data-place");
          render(board);
        });
      });
      rows();
    }

    async function load() {
      const r = await fetch(`data/board.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    }

    load().catch(() => {
      document.getElementById("source").textContent = "Could not load data/board.json";
    });
    setInterval(() => { load().catch(() => {}); }, 60000);
  </script>
</body>
</html>
